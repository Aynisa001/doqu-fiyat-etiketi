name: Koltuk & Yatak Fiyatlarını Senkronize Et

# Bu workflow, sync-prices.yml ile AYNI mantığı Koltuklar ve
# Yatak & Yatak Pedi kategorileri için uygular: doquhome.com.tr'nin
# ilgili kategori sayfalarını (scripts/fetch_sofa_prices.py ile) tarar,
# sonucu repo'daki sofa-prices.json dosyasına yazar. Site
# (doqu-fiyat-etiketi-v8.html) bu dosyayı sayfa her açıldığında aynı
# sunucudan (./sofa-prices.json) okur, böylece tarayıcı CORS sorunu
# yaşanmaz (doquhome.com.tr'ye tarayıcıdan doğrudan bağlanmak CORS
# politikaları yüzünden engellenir).

on:
  schedule:
    # Her saat başı çalışır (UTC saatine göre). Fiyatlar günde birkaç
    # kez değişebiliyorsa aralığı azaltabilirsiniz (örn. '*/30 * * * *'),
    # ama siteye gereksiz yük bindirmemek için saatlik makul bir varsayılan.
    - cron: '0 * * * *'
  workflow_dispatch:
    # GitHub'da "Actions" sekmesinden elle "Run workflow" ile de
    # anında tetikleyebilirsiniz — ilk kurulumda çıktıyı doğrulamak
    # için bunu kullanın.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4

      - name: doquhome.com.tr'den fiyatları çek
        run: python scripts/fetch_sofa_prices.py > sofa-prices.json.new

      - name: Dosyanın boş/bozuk olmadığını kontrol et
        run: |
          if [ ! -s sofa-prices.json.new ]; then
            echo "Üretilen dosya boş, senkronizasyon iptal ediliyor."
            exit 1
          fi
          python -c "import json,sys; json.load(open('sofa-prices.json.new'))" \
            || { echo "Geçersiz JSON, senkronizasyon iptal ediliyor."; exit 1; }
          mv sofa-prices.json.new sofa-prices.json

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sofa-prices.json; then
            echo "Fiyatlarda değişiklik yok."
          else
            git add sofa-prices.json
            git commit -m "Koltuk/Yatak fiyatlarını senkronize et ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
